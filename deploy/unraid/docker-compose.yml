# Actual Budget — Unraid deployment (host: wolverine), via Compose Manager.
#
# Two containers on the stack's private network:
#   tailscale      joins the tailnet as "actual" and serves
#                  https://actual.<tailnet>.ts.net with a real certificate,
#                  proxying to http://actual-server:5006 by container name
#   actual-server  the sync server + web app, built from this fork by
#                  .github/workflows/unraid-image.yml
#
# No ports are published on the LAN. Actual's web app needs a secure context
# (HTTPS) anywhere other than localhost, so plain http://wolverine.local:5006
# would not work anyway — every device uses the tailnet URL.
#
# Same pattern for any app: add a tailscale service next to it and point the
# serve config's Proxy at the app's container name and port.
#
# Updates: Watchtower (its own stack, from the jonnymo5/watchtower fork) only
# touches containers labelled com.centurylinklabs.watchtower.enable=true.
# actual-server is labelled. tailscale is pinned by version + digest and
# updated by hand, so it is explicitly opted out.
#
# Storage: bind-mounts under /mnt/maincache/appdata — the DIRECT cache-disk
# path, deliberately NOT /mnt/user/appdata. Actual keeps its data in SQLite,
# and Unraid's /mnt/user FUSE layer (shfs) has file-locking quirks with SQLite.
#
# Secrets: put TS_AUTHKEY in a .env file next to this compose file on
# wolverine (never commit it). Setup steps: see README.md in this directory.
#
# Requires Docker Compose v2.23+ (inline `configs.content`).

services:
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: actual-tailscale
    hostname: actual # tailnet machine name -> https://actual.<tailnet>.ts.net
    environment:
      # Only used for the first login; state is persisted in TS_STATE_DIR.
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY in .env next to this file}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - /mnt/maincache/appdata/actual-budget/tailscale:/var/lib/tailscale
    configs:
      - source: ts-serve
        target: /config/serve.json
    depends_on:
      - actual-server
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  actual-server:
    image: ghcr.io/jonnymo5/actual-server:latest
    container_name: actual-server
    user: '99:100' # Unraid's nobody:users, so appdata files have normal ownership
    # No `ports:` — only reachable from this stack's network (i.e. tailscale).
    volumes:
      - /mnt/maincache/appdata/actual-budget/data:/data
    # Config options: https://actualbudget.org/docs/config/
    # environment:
    #   - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

configs:
  # tailscale serve: HTTPS on :443 -> actual-server:5006, tailnet only.
  # `$$` escapes compose interpolation; containerboot fills in TS_CERT_DOMAIN.
  ts-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://actual-server:5006" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": false }
      }
