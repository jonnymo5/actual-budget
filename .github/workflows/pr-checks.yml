# Sanity-check pull requests before they merge: run the unit tests, and make
# sure both Unraid images still build and boot.
#
# This is the only check that runs on a PR. The unraid-image and
# unraid-mcp-image workflows build and push the same images, but only after a
# merge to master, and Watchtower on wolverine deploys what they push. This
# runs the build and the boot test of each image without the registry login
# and push, so a change that would break an image is caught here instead.
#
# The steps in the two image jobs mirror the matching steps in
# unraid-image.yml and unraid-mcp-image.yml; keep them in step when changing
# either.
name: pr-checks

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - packages/docs/**
      - upcoming-release-notes/**
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # English only: skip checking out actualbudget/translations at an
          # unpinned HEAD.
          download-translations: 'false'

      # Every workspace's tests, through lage.
      - name: Test
        run: yarn test

  sync-server-image:
    name: Sync server image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      # Build the web client + server on the runner, then copy the output into
      # the image (same approach as unraid-image.yml).
      - name: Build server
        run: yarn build:server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Reads the layers unraid-image.yml cached on master; writes nothing back.
      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: actual-server-testing
          cache-from: type=gha

      - name: Test that the image boots
        timeout-minutes: 2
        run: |
          docker run --detach --name actual-server actual-server-testing
          until docker exec actual-server node scripts/health-check.js; do sleep 2; done

      - name: Dump container logs on failure
        if: failure()
        run: docker logs actual-server || true

  mcp-server-image:
    name: MCP server image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'

      # The image only copies these bundles in (same approach as unraid-mcp-image.yml).
      - name: Build API and MCP server
        run: |
          yarn build:api
          yarn workspace @actual-app/mcp-server build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Reads the layers unraid-mcp-image.yml cached on master; writes nothing back.
      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: packages/mcp-server/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: actual-mcp-testing
          cache-from: type=gha,scope=actual-mcp

      # No Actual server is running here, so the budget never opens; what is
      # checked is that the bundle and its production dependencies load, and
      # that the server answers over HTTP.
      - name: Test that the image boots
        timeout-minutes: 2
        run: |
          docker run --detach --name actual-mcp --publish 3600:3600 \
            --env ACTUAL_SERVER_URL=http://127.0.0.1:1 \
            --env ACTUAL_SERVER_PASSWORD=ci-placeholder \
            --env ACTUAL_SYNC_ID=ci-placeholder \
            actual-mcp-testing
          until curl --silent --fail http://127.0.0.1:3600/healthz; do sleep 2; done
          echo
          curl --silent --fail --request POST http://127.0.0.1:3600/mcp \
            --header 'content-type: application/json' \
            --header 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
            | tee /dev/stderr | grep --quiet '"name":"actual-budget"'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs actual-mcp || true
